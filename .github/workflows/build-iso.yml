name: build-iso

on:
  push:
    paths:
      - iso/**
      - .github/workflows/build-iso.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Instalar live-build de Debian y herramientas
        run: |
          set -o pipefail
          mkdir -p logs
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux-common isolinux curl debootstrap binutils debian-archive-keyring
            LB_DEB=$(curl -s http://deb.debian.org/debian/pool/main/l/live-build/ | grep -o 'live-build_[^"]*_all\.deb' | sort -u | sort -V | tail -n 1)
            LB_DEB=${LB_DEB//%2b/+}
            if [ -z "$LB_DEB" ]; then echo "ERROR: no se encontro el paquete live-build en el pool"; exit 1; fi
            echo "Descargando: $LB_DEB"
            curl -fSO "http://deb.debian.org/debian/pool/main/l/live-build/$LB_DEB"
            sudo dpkg -i "$LB_DEB" || sudo apt-get -f install -y
            dpkg -l live-build | tail -n 1
          } 2>&1 | tee logs/setup.log

      - name: Configurar la imagen
        working-directory: iso
        run: |
          set -o pipefail
          sh auto/config 2>&1 | tee "$GITHUB_WORKSPACE/logs/config.log"

      - name: Compilar la ISO
        working-directory: iso
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"

      - name: Renombrar la imagen
        run: |
          cd iso
          ls -lh *.iso
          mv -f binary-hybrid.iso e6400-blackhole-matrix-amd64.iso 2>/dev/null || mv -f *.iso e6400-blackhole-matrix-amd64.iso

      - name: Publicar release con la ISO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: E6400 Black Hole Matrix ISO (build ${{ github.run_number }})
          body: ISO live de 64 bits (Debian bookworm) para Dell Latitude E6400 con look Windows Vista + Black Hole Matrix. Grabar en USB y arrancar en modo Legacy/BIOS.
          files: iso/e6400-blackhole-matrix-amd64.iso

      - name: Subir artefacto ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e6400-blackhole-matrix-amd64
          path: iso/e6400-blackhole-matrix-amd64.iso
          if-no-files-found: ignore

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore

  report:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Descargar logs
        uses: actions/download-artifact@v4
        with:
          name: logs
          path: logs
        continue-on-error: true

      - name: Reportar fallo en un issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Fallo el build de la ISO (run ${{ github.run_number }}, commit ${{ github.sha }})."
            echo
            for f in logs/setup.log logs/config.log logs/build.log; do
              if [ -f "$f" ]; then
                echo "### $f (ultimas 100 lineas)"
                echo \`\`\`
                tail -n 100 "$f"
                echo \`\`\`
                echo
              fi
            done
          } > body.md
          gh issue create --repo "${{ github.repository }}" --title "build-iso fallo en el run ${{ github.run_number }}" --body-file body.md