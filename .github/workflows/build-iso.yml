name: build-iso

on:
  push:
    paths:
      - iso/**
      - .github/workflows/build-iso.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Instalar herramientas de compilacion
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates live-build xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools \
            syslinux-common isolinux curl jq
          lb --version || true

      - uses: actions/checkout@v4

      - name: Compilar la ISO
        working-directory: iso
        run: |
          set -o pipefail
          sh auto/config
          lb build 2>&1 | tee build.log

      - name: Renombrar la imagen
        run: |
          cd iso
          ls -lh *.iso
          mv -f binary-hybrid.iso e6400-blackhole-matrix-amd64.iso 2>/dev/null || mv -f *.iso e6400-blackhole-matrix-amd64.iso

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: e6400-blackhole-matrix-amd64
          path: iso/e6400-blackhole-matrix-amd64.iso

      - name: Publicar release con la ISO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: E6400 Black Hole Matrix ISO (build ${{ github.run_number }})
          files: iso/e6400-blackhole-matrix-amd64.iso

      - name: Subir log si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-run-${{ github.run_number }}
          path: iso/build.log

      - name: Reportar fallo en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUNN: ${{ github.run_number }}
        run: |
          tail -c 3500 iso/build.log > /tmp/tail.txt 2>/dev/null || echo "sin build.log" > /tmp/tail.txt
          jq -n --rawfile b /tmp/tail.txt '{title: ("build-iso fallo en el run " + env.RUNN), body: ("Log de live-build (ultimas lineas):\n\n```\n" + $b + "\n```")}' > /tmp/issue.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" \
            -d @/tmp/issue.json || true
