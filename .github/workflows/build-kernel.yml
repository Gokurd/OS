name: build-kernel

on:
  push:
    paths:
      - 'remaster/kernel-e6400.config'
      - '.github/workflows/build-kernel.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilacion
        run: |
          set -e
          sudo apt-get update 2>&1 | tail -3 | tee -a ci-kernel.log
          sudo apt-get install -y build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc dwarves fakeroot curl cpio kmod zstd debhelper 2>&1 | tail -5 | tee -a ci-kernel.log

      - name: Descargar fuente del kernel 6.6 LTS
        run: |
          set -e
          ver=""
          listing="$(curl -fsSL --max-time 90 https://cdn.kernel.org/pub/linux/kernel/v6.x/ 2>>ci-kernel.log || true)"
          ver="$(printf '%s' "$listing" | grep -o 'linux-6\.6\.[0-9]\+\.tar\.xz' | sort -V | tail -1 || true)"
          if [ -z "$ver" ]; then
            echo "Listado de kernel.org vacio o ilegible; pruebo versiones conocidas" | tee -a ci-kernel.log
            for cand in 6.6.60 6.6.58 6.6.56 6.6.52 6.6.48 6.6.30; do
              if curl -fsI --max-time 30 "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$cand.tar.xz" >/dev/null 2>&1; then
                ver="linux-$cand.tar.xz"; break
              fi
            done
          fi
          echo "Version elegida: $ver" | tee -a ci-kernel.log
          [ -n "$ver" ] || { echo "No se pudo determinar la version 6.6.x" | tee -a ci-kernel.log; exit 1; }
          echo "KVER=${ver%.tar.xz}" >> "$GITHUB_ENV"
          # /mnt es de root: descargar en RUNNER_TEMP, mover con sudo y
          # extraer con sudo; luego devolver la propiedad al runner para que
          # make olddefconfig/bindeb-pkg puedan escribir sin fallos de permisos.
          curl -fL --retry 3 -o "$RUNNER_TEMP/$ver" "https://cdn.kernel.org/pub/linux/kernel/v6.x/$ver" 2>>ci-kernel.log
          sudo mv -f "$RUNNER_TEMP/$ver" /mnt/"$ver"
          sudo tar -xf /mnt/"$ver" -C /mnt
          sudo chown -R "$(id -u):$(id -g)" /mnt/linux-6.6.*
          ls -d /mnt/linux-6.6.* | tee -a ci-kernel.log

      - name: Configurar kernel a la medida E6400
        shell: bash
        run: |
          set -euo pipefail
          # Todo el paso va a ci-kernel.log en un bloque agrupado: el exec con
          # process-substitution dejaba el tee vivo al cerrar y Actions marcaba
          # el paso como fallido DESPUES de verificar (causa del fallo en 35s).
          {
          cd /mnt/"$KVER"
          make x86_64_defconfig
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/remaster/kernel-e6400.config"
          make olddefconfig
          # Verificaciones clave del perfil E6400
          for opt in CONFIG_DRM_I915=y CONFIG_SQUASHFS=y CONFIG_PREEMPT=y \
                     CONFIG_E1000E=y CONFIG_ZRAM=m; do
            k="${opt%%=*}"; v="${opt#*=}"
            grep -q "^${k}=${v}$" .config || { echo "FALTA $opt"; grep "$k" .config || true; exit 1; }
          done
          # DEBUG_INFO: se acepta DEBUG_INFO_NONE=y o que BTF quede desactivado
          # (en 6.6.x reciente olddefconfig puede resolverlo de otra forma).
          if grep -q '^CONFIG_DEBUG_INFO_NONE=y' .config; then
            echo "DEBUG_INFO_NONE=y presente."
          elif ! grep -q '^CONFIG_DEBUG_INFO_BTF=y' .config; then
            echo "Sin BTF/DEBUG_INFO_BTF: suficiente para el perfil ligero."
          else
            echo "CONFIG_DEBUG_INFO_BTF=y activo; se desactiva para el perfil ligero."
            ./scripts/config --disable DEBUG_INFO_BTF || true
            make olddefconfig
            ! grep -q '^CONFIG_DEBUG_INFO_BTF=y' .config || { echo "No se pudo desactivar BTF"; exit 1; }
          fi
          echo "Configuracion E6400 verificada."
          } 2>&1 | tee -a ci-kernel.log

      - name: Compilar kernel y paquetes .deb
        shell: bash
        run: |
          set -uo pipefail
          # Log UNICO en el workspace: el run 9 demonstro que tras "cd /mnt/$KVER"
          # los tee relativos iban a /mnt/linux-6.6.162/ci-kernel.log y el issue
          # se generaba sin el error real de make. Ahora: make -C + rutas absolutas.
          L="$GITHUB_WORKSPACE/ci-kernel.log"
          OUT="$GITHUB_WORKSPACE/ci-make-stdout.log"
          echo "=== inicio de compilacion: $(date) ===" | tee -a "$L"
          echo "KVER=[${KVER:-VACIO}] cwd=$(pwd)" | tee -a "$L"
          test -n "${KVER:-}" || { echo "KVER vacio" | tee -a "$L"; exit 3; }
          test -d "/mnt/$KVER" || { echo "Falta /mnt/$KVER" | tee -a "$L"; exit 3; }
          set +e
          sudo make -C "/mnt/$KVER" -j"$(nproc)" bindeb-pkg \
            KDEB_PKGVERSION="${KVER#linux-}-blackhole1" \
            > "$OUT" 2>&1
          rc=$?
          set -e
          echo "make bindeb-pkg rc=$rc" | tee -a "$L"
          cp -f "$OUT" "$GITHUB_WORKSPACE/ci-kernel-build.log" 2>/dev/null || true
          echo "### cola de make (40) ###" >> "$L"
          tail -n 40 "$OUT" >> "$L" 2>/dev/null || echo "(make sin salida)" >> "$L"
          echo "### estado: ###" >> "$L"
          ls -la "/mnt/$KVER"/../*blackhole1*.deb 2>&1 | tee -a "$L" || true
          echo "make rc=$rc" | tee -a "$L"
          exit $rc

      - name: Publicar kernel como release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Kernel a la medida E6400 (${{ env.KVER }}-blackhole-e6400)
          body: |
            Kernel Linux compilado a la medida del Dell Latitude E6400
            (Core 2 Duo P8400, GMA 4500MHD, 2 GiB DDR2, BIOS Legacy A14).

            Instalar en Black Hole Linux (tras instalar al disco):
              sudo apt install ./linux-image-*-blackhole-e6400_*.deb ./linux-headers-*-blackhole-e6400_*.deb
              sudo blackhole firstboot   (o update-grub si ya hiciste firstboot)

            El kernel Live de la ISO sigue siendo el de Bodhi (pareja vmlinuz/initrd
            original); este kernel se usa en el sistema instalado.
          files: |
            /mnt/linux-image-*.deb
            /mnt/linux-headers-*.deb
            /mnt/linux-libc-dev*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir log de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-kernel-log-r${{ github.run_number }}
          path: |
            ci-kernel.log
            ci-kernel-build.log
          if-no-files-found: ignore

      - name: Abrir issue si fallo (con cola del log)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Fallo el build-kernel (run ${{ github.run_number }}, commit ${{ github.sha }})."
            echo ""
            echo "### estado del workspace"
            echo '```'
            ls -la . /mnt 2>&1 | head -n 40 || true
            echo '```'
            echo ""
            echo "### ci-kernel.log (ultimas 150 lineas)"
            echo '```'
            tail -n 150 ci-kernel.log 2>/dev/null || echo "(sin ci-kernel.log: fallo antes de compilar)"
            echo '```'
            echo ""
            echo "### ci-kernel-build.log (ultimas 60 lineas)"
            echo '```'
            tail -n 60 ci-kernel-build.log 2>/dev/null || echo "(sin ci-kernel-build.log)"
            echo '```'
          } > issue-body.md
          gh issue create --title "build-kernel fallo en el run ${{ github.run_number }}" --body-file issue-body.md || true
# (nota: retoque para forzar el disparo del workflow)

