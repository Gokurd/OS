backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 10;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.55;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
inactive-opacity = 0.93;
frame-opacity = 0.9;
